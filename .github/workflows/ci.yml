name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04  # ubuntu-latest 已迁移 26.04，其上无 3.9 预编译版
    strategy:
      matrix:
        python-version: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run test suite (zero-dependency, stdlib only)
        run: python scripts/test_v26.py
      - name: "Smoke: validator accepts example dossier"
        run: python scripts/validate.py examples/example-dossier.json
