name: Schema RFC
description: 对 dossier/gene/hooks/proposal 四个 schema 提出修改建议
labels: [rfc, schema]
body:
  - type: dropdown
    id: schema
    attributes:
      label: 目标 schema
      options: [dossier.schema.json, gene.schema.json, hooks.schema.json, proposal.schema.json]
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: 建议修改
      description: 现状 → 建议 → 理由（谁会用这个字段/约束）
    validations:
      required: true
